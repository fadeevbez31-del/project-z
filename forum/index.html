<!doctype html>
<html lang="ru">
<head>
    <link rel="icon" type="image/png" sizes="any" href="/favicon.png?v=20261016-2">
<link rel="shortcut icon" href="/favicon.png?v=20261016-2">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Форум | PROJECT Z</title>
<style>
:root{color-scheme:dark;--bg:#0d0913;--panel:#171020;--panel2:#23172f;--line:#48305e;--purple:#a84bf1;--text:#f3eafb;--muted:#b9a7c9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#251039,#0d0913 65%);font:15px system-ui,Segoe UI,sans-serif;color:var(--text)}header{padding:24px max(20px,calc((100% - 1080px)/2));border-bottom:1px solid var(--line);background:#100a18}header h1{margin:0;color:#d7a2ff;letter-spacing:3px}header p{color:var(--muted);margin:6px 0 0}main{max-width:1080px;margin:26px auto;padding:0 18px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}.panel,.category,.topic{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:20px;margin-bottom:14px}.category,.topic{cursor:pointer;transition:border-color .15s}.category:hover,.topic:hover{border-color:var(--purple)}.category h3,.topic h3{margin:0 0 7px}.muted{color:var(--muted);font-size:13px}.btn{background:#7135aa;color:white;border:1px solid #a456dd;border-radius:8px;padding:10px 15px;cursor:pointer;font-weight:600}.btn:hover{background:#8d42cc}.btn.secondary{background:#24172f;border-color:#53396c}input,textarea{display:block;width:100%;padding:12px;border-radius:8px;background:#100b19;border:1px solid #59416d;color:white;margin:9px 0 15px;font:inherit}input[type=file][hidden]{display:none!important}textarea{min-height:125px;resize:vertical}label{display:block;color:#d8c3e9}button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.hidden{display:none!important}.error{color:#ff9eaf}.success{color:#b0f0c8}.post{padding:14px 0;border-top:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}.post strong{color:#d6a2ff}.post p{margin:8px 0 0}a{color:#c58bff}.back{margin-bottom:15px}.content{white-space:pre-wrap;overflow-wrap:anywhere}footer{text-align:center;padding:35px;color:var(--muted)}
#otpPanel{border-color:#9b54d8;background:linear-gradient(135deg,#241333,#171020)}#otpCode{font-size:27px;text-align:center;letter-spacing:9px;font-weight:700;max-width:300px}#otpEmail{color:#d8a6ff}#nicknameRow.hidden{display:none!important}
.logo-link {
    text-decoration: none !important;
    color: inherit;
    display: inline-block;
}

.logo-link h1 {
    color: #c084fc;
    cursor: pointer;
    text-decoration: none !important;
    transition: color 0.3s ease, text-shadow 0.3s ease;
}

.logo-link:hover h1 {
    color: #e9d5ff;
    text-shadow:
        0 0 10px #a855f7,
        0 0 20px #9333ea,
        0 0 35px #7e22ce;
}
</style>
</head>
<body><header><a href="https://projectz.site/" class="logo-link">
  <h1>☣ PROJECT Z</h1>
</a><p>Форум сообщества Counter-Strike: Source · <a href="/forum/">На главную</a></p></header>
<main><div class="toolbar"><h2 id="heading">Форум</h2><div class="row" id="authBar"><button class="btn" id="showLogin">Войти / Регистрация</button></div></div>
<div id="notice" role="status"></div>
<section class="panel hidden" id="authPanel"><div class="row"><button class="btn secondary" id="loginTab">Вход</button><button class="btn secondary" id="signupTab">Регистрация</button></div><form id="authForm"><label id="nicknameRow" class="hidden">Ник на форуме<input id="nickname" maxlength="40" autocomplete="nickname"></label><label>Email<input type="email" id="email" required autocomplete="email"></label><label>Пароль<input type="password" id="password" required minlength="8" autocomplete="current-password"></label><button class="btn" id="authSubmit">Войти</button></form><p class="muted" id="authHint">Для регистрации выбери вкладку «Регистрация».</p></section>
<section class="panel hidden" id="otpPanel"><h3>✉ Подтверждение почты</h3><p>Мы отправили код на <strong id="otpEmail"></strong>. Введи его ниже.</p><form id="otpForm"><label>Код из письма<input id="otpCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" autocomplete="one-time-code" placeholder="000000" required></label><div class="row"><button class="btn" id="otpSubmit" type="submit">Подтвердить почту</button><button class="btn secondary" id="otpResend" type="button">Отправить код ещё раз</button><button class="btn secondary" id="otpCancel" type="button">Отмена</button></div></form><p class="muted">Код действует ограниченное время. Не сообщай его другим.</p></section>
<div id="content"></div>
<section id="editor" class="panel hidden"><h3 id="editorTitle">Новая тема</h3><form id="topicForm"><label>Заголовок<input id="topicTitle" maxlength="140" required></label><label>Сообщение<textarea id="topicBody" maxlength="15000" required></textarea></label><div class="row" style="margin-top:4px"><label class="btn secondary" for="topicFile" style="display:inline-flex;align-items:center;gap:7px;cursor:pointer">📎 Прикрепить файл</label><input id="topicFile" type="file" hidden><span id="topicFileName" class="muted">Файл не выбран</span><button class="btn" type="submit">Опубликовать тему</button></div></form></section>
</main><footer>© PROJECT Z · Форум сообщества</footer>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://projectz-forum-proxy.fadeevbez31.workers.dev','sb_publishable_lYozlUVzBX5DOXG6q3i71A_IN8ASSHP');
const $=id=>document.getElementById(id);let user=null,mode='login',pendingEmail='',view={type:'categories'},categories=[],profiles={},currentRole='player';
const restrictedCategoryIds=[1,6];
function canDelete(authorId,categoryId){return !!user&&(currentRole==='admin'||(user.id===authorId&&!restrictedCategoryIds.includes(Number(categoryId))))}
function deleteButton(label,handler){const b=el('button','btn secondary',label);b.style.marginLeft='10px';b.style.borderColor='#ad537e';b.onclick=async e=>{e.stopPropagation();if(!confirm('Удалить без возможности восстановления?'))return;b.disabled=true;try{await handler()}finally{b.disabled=false}};return b}
function canCreateTopic(){return !!user&&view.type==='category'&&(!restrictedCategoryIds.includes(Number(view.id))||currentRole==='admin')}
async function refreshRole(){currentRole='player';if(user){const {data,error}=await supabase.from('profiles').select('role').eq('id',user.id).maybeSingle();if(!error)currentRole=data?.role||'player'}renderEditor()}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n}
function msg(text,error=false){$('notice').replaceChildren(el('p',error?'error':'success',text));}
function err(e){msg(e?.message||'Произошла ошибка',true)}
const MAX_FILE_SIZE=10*1024*1024;
function formatFileSize(bytes){if(bytes<1024)return bytes+' Б';if(bytes<1024*1024)return (bytes/1024).toFixed(1)+' КБ';return (bytes/1024/1024).toFixed(1)+' МБ'}
async function uploadForumFile(file){
  if(!file)return null;
  if(file.size>MAX_FILE_SIZE)throw new Error('Файл слишком большой. Максимальный размер — 10 МБ.');
  const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path=user.id+'/'+Date.now()+'_'+crypto.randomUUID()+'_'+safeName;
  const {error}=await supabase.storage.from('forum-attachments').upload(path,file,{upsert:false});
  if(error)throw error;
  const {data}=supabase.storage.from('forum-attachments').getPublicUrl(path);
  return {name:file.name,size:file.size,url:data.publicUrl};
}
function attachmentHtml(a){
  if(!a || !a.url)return null;
  const box=el('div','panel');
  box.style.marginTop='14px';
  box.style.padding='12px';
  const link=el('a','', '📎 '+(a.name||'Файл')+' ('+formatFileSize(a.size||0)+')');
  link.href=a.url;
  link.target='_blank';
  link.rel='noopener noreferrer';
  const name=String(a.name||'').toLowerCase();
  const isImage=['.png','.jpg','.jpeg','.gif','.webp','.avif','.bmp','.svg'].some(ext=>name.endsWith(ext));
  if(isImage){
    const preview=el('img');
    preview.src=a.url;
    preview.alt=a.name||'Изображение';
    preview.loading='lazy';
    preview.style.cssText='display:block;max-width:100%;max-height:650px;width:auto;height:auto;object-fit:contain;border-radius:9px;margin:0 auto;';
    const imageLink=el('a');
    imageLink.href=a.url;
    imageLink.target='_blank';
    imageLink.rel='noopener noreferrer';
    imageLink.appendChild(preview);
    box.appendChild(imageLink);
    preview.onerror=function(){imageLink.replaceWith(link);};
  }else{
    box.appendChild(link);
  }
  return box;
}
function showAuth(visible){$('authPanel').classList.toggle('hidden',!visible)}
function authMode(next){mode=next;$('authSubmit').textContent=mode==='login'?'Войти':'Зарегистрироваться';$('nicknameRow').classList.toggle('hidden',mode!=='signup');$('nickname').required=mode==='signup';$('password').autocomplete=mode==='signup'?'new-password':'current-password';$('authHint').textContent=mode==='login'?'Введите email и пароль.':'После регистрации на почту придёт шестизначный код.';}
function showOtp(email){pendingEmail=email;$('otpEmail').textContent=email;$('otpPanel').classList.remove('hidden');$('otpCode').value='';showAuth(false);$('otpCode').focus()}
$('showLogin').onclick=()=>showAuth($('authPanel').classList.contains('hidden'));
$('loginTab').onclick=()=>authMode('login');$('signupTab').onclick=()=>authMode('signup');
$('authForm').onsubmit=async e=>{e.preventDefault();const email=$('email').value.trim(),password=$('password').value;const button=$('authSubmit');button.disabled=true;try{if(mode==='login'){const {error}=await supabase.auth.signInWithPassword({email,password});if(error)throw error;msg('Вход выполнен.');showAuth(false)}else{const nickname=$('nickname').value.trim();if(!nickname||nickname.length>40){msg('Укажи ник до 40 символов.',true);return}const {data,error}=await supabase.auth.signUp({email,password,options:{data:{nickname}}});if(error)throw error;if(data.session){msg('Аккаунт создан. Проверь настройки обязательного подтверждения почты.');showAuth(false)}else{showOtp(email);msg('Письмо с кодом отправлено, если регистрация разрешена для этого адреса.')}}}catch(error){err(error)}finally{button.disabled=false}};
$('otpForm').onsubmit=async e=>{e.preventDefault();const token=$('otpCode').value.trim();if(!/^\d{6}$/.test(token))return msg('Введи шесть цифр из письма.',true);const button=$('otpSubmit');button.disabled=true;try{const {error}=await supabase.auth.verifyOtp({email:pendingEmail,token,type:'signup'});if(error)throw error;$('otpPanel').classList.add('hidden');msg('Почта подтверждена! Ты вошёл на форум.')}catch(error){err(error)}finally{button.disabled=false}};
$('otpResend').onclick=async()=>{const button=$('otpResend');button.disabled=true;try{const {error}=await supabase.auth.resend({type:'signup',email:pendingEmail});if(error)throw error;msg('Если повторная отправка разрешена, новый код отправлен.')}catch(error){err(error)}finally{button.disabled=false}};
$('otpCancel').onclick=()=>{$('otpPanel').classList.add('hidden');pendingEmail='';showAuth(true)};
supabase.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;currentRole='player';renderAuth();refreshRole();});
function renderAuth(){const bar=$('authBar');bar.replaceChildren();if(user){bar.append(el('span','muted',user.email));const profile=el('button','btn secondary','Мой профиль');profile.onclick=()=>openProfile(user.id);bar.append(profile);const out=el('button','btn secondary','Выйти');out.onclick=()=>supabase.auth.signOut();bar.append(out)}else{const login=el('button','btn','Войти / Регистрация');login.onclick=()=>showAuth(true);bar.append(login)}renderEditor()}
function renderEditor(){const allowed=canCreateTopic();$('editor').classList.toggle('hidden',!allowed);if(allowed)$('editorTitle').textContent='Новая тема в разделе «'+(categories.find(c=>c.id===view.id)?.name||'')+'»'}
function back(label,fn){const b=el('button','btn secondary back','← '+label);b.onclick=fn;return b}
async function loadCategories(){view={type:'categories'};$('heading').textContent='Разделы форума';$('content').replaceChildren();renderEditor();const {data,error}=await supabase.from('forum_categories').select('id,name,description,icon,sort_order').order('sort_order');if(error)return err(error);categories=data||[];if(!categories.length)$('content').append(el('p','muted','Категорий пока нет.'));for(const c of categories){const card=el('article','category');card.append(el('h3','',`${c.icon||'💬'} ${c.name}`),el('div','muted',c.description||''));card.onclick=()=>openCategory(c.id);$('content').append(card)}}
async function openCategory(id){view={type:'category',id};const c=categories.find(x=>x.id===id);$('heading').textContent=c?.name||'Темы';$('content').replaceChildren(back('Все разделы',loadCategories));renderEditor();const {data,error}=await supabase.from('forum_topics').select('id,title,body,author_id,created_at').eq('category_id',id).order('created_at',{ascending:false}).limit(100);if(error)return err(error);if(!data?.length)$('content').append(el('p','muted','Тем пока нет. Зарегистрируйся и создай первую!'));for(const t of data||[]){const card=el('article','topic');card.append(el('h3','',t.title),el('div','muted',new Date(t.created_at).toLocaleString('ru-RU')));card.onclick=()=>openTopic(t.id,id);if(canDelete(t.author_id,id)){card.append(deleteButton('Удалить тему',async()=>{const {data,error}=await supabase.from('forum_topics').delete().eq('id',t.id).select('id');if(error)return err(error);if(!data?.length)return msg('Удаление запрещено политикой доступа Supabase.',true);msg('Тема удалена');await openCategory(id)}))}$('content').append(card)}}
async function openTopic(id,categoryId){view={type:'topic',id,categoryId};$('heading').textContent='Тема форума';$('content').replaceChildren(back('К темам',()=>openCategory(categoryId)));renderEditor();const {data:t,error}=await supabase.from('forum_topics').select('id,title,body,author_id,created_at').eq('id',id).single();if(error)return err(error);$('heading').textContent=t.title;const panel=el('section','panel');const author=el('button','btn secondary','Профиль автора');author.onclick=()=>openProfile(t.author_id);if(canDelete(t.author_id,categoryId))panel.append(deleteButton('Удалить тему',async()=>{const {data,error}=await supabase.from('forum_topics').delete().eq('id',id).select('id');if(error)return err(error);if(!data?.length)return msg('Удаление запрещено политикой доступа Supabase.',true);msg('Тема удалена');await openCategory(categoryId)}));let topicBody=t.body||'',attachment=null;
const marker='[[ATTACHMENT]]';
const markerPos=topicBody.lastIndexOf(marker);
if(markerPos!==-1){
  try{
    const raw=topicBody.slice(markerPos+marker.length).replace(/^(?:\\n|\s)+/g,'').trim();
    const parsed=JSON.parse(raw);
    if(parsed&&typeof parsed.url==='string'){
      attachment=parsed;
      topicBody=topicBody.slice(0,markerPos).replace(/(?:\\n|\s)+$/g,'').trim();
    }
  }catch(e){console.warn('Не удалось прочитать вложение:',e)}
}
panel.append(author,el('p','muted',new Date(t.created_at).toLocaleString('ru-RU')),el('div','content',topicBody));
const attachmentBox=attachmentHtml(attachment);if(attachmentBox)panel.append(attachmentBox);$('content').append(panel);const replies=el('section','panel');replies.append(el('h3','','Ответы'));$('content').append(replies);const {data:items,error:re}=await supabase.from('forum_replies').select('id,body,author_id,created_at').eq('topic_id',id).order('created_at');if(re)return err(re);for(const r of items||[]){const p=el('div','post');const authorButton=el('button','btn secondary','Автор ответа');authorButton.onclick=()=>openProfile(r.author_id);p.append(authorButton,el('span','muted',' '+new Date(r.created_at).toLocaleString('ru-RU')),el('p','',r.body));if(canDelete(r.author_id,categoryId))p.append(deleteButton('Удалить ответ',async()=>{const {data,error}=await supabase.from('forum_replies').delete().eq('id',r.id).select('id');if(error)return err(error);if(!data?.length)return msg('Удаление запрещено политикой доступа Supabase.',true);msg('Ответ удалён');await openTopic(id,categoryId)}));replies.append(p)}if(user){const form=el('form');const field=el('textarea');field.required=true;field.maxLength=15000;field.placeholder='Напиши ответ...';const submit=el('button','btn','Ответить');form.append(field,submit);form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;const {error}=await supabase.from('forum_replies').insert({topic_id:id,author_id:user.id,body:field.value.trim()});submit.disabled=false;if(error)return err(error);msg('Ответ добавлен');openTopic(id,categoryId)};replies.append(form)}else replies.append(el('p','muted','Войди, чтобы ответить.'))}
async function openProfile(id){const previous={...view};view={type:'profile',id};$('heading').textContent='Профиль игрока';$('content').replaceChildren(back('Назад',()=>previous.type==='topic'?openTopic(previous.id,previous.categoryId):previous.type==='category'?openCategory(previous.id):loadCategories()));renderEditor();const {data,error}=await supabase.from('profiles').select('id,nickname,avatar_url,role').eq('id',id).maybeSingle();if(error)return err(error);if(!data){$('content').append(el('p','muted','Профиль не найден.'));return}const p=el('section','panel');p.append(el('h3','',data.nickname||'Игрок'),el('p','muted','Роль: '+(data.role||'player')));$('content').append(p);if(user?.id===id){const form=el('form');const name=el('input');name.value=data.nickname||'';name.maxLength=40;name.required=true;const save=el('button','btn','Сохранить ник');form.append(el('label','','Изменить ник'),name,save);form.onsubmit=async e=>{e.preventDefault();const {error}=await supabase.from('profiles').update({nickname:name.value.trim()}).eq('id',id);if(error)return err(error);msg('Ник сохранён');openProfile(id)};p.append(form)}}
$('topicFile').onchange=()=>{const f=$('topicFile').files[0];$('topicFileName').textContent=f?'📎 '+f.name+' ('+formatFileSize(f.size)+')':'Файл не выбран'};
$('topicForm').onsubmit=async e=>{e.preventDefault();if(!canCreateTopic())return msg('В этом разделе создавать темы может только администратор. Войди под нужным аккаунтом.',true);const title=$('topicTitle').value.trim(),body=$('topicBody').value.trim(),file=$('topicFile').files[0];if(!title||!body)return;const button=$('topicForm').querySelector('button[type="submit"]');button.disabled=true;try{let finalBody=body;if(file){msg('Загружаю файл...');const attachment=await uploadForumFile(file);finalBody=body+'\n\n[[ATTACHMENT]]\n'+JSON.stringify(attachment)}const {data,error}=await supabase.from('forum_topics').insert({category_id:view.id,author_id:user.id,title,body:finalBody}).select('id').single();if(error)throw error;$('topicForm').reset();$('topicFileName').textContent='Файл не выбран';msg('Тема опубликована!');openTopic(data.id,view.id)}catch(error){err(error)}finally{button.disabled=false}};
const {data:{session}}=await supabase.auth.getSession();user=session?.user||null;renderAuth();await refreshRole();loadCategories();
</script></body></html>

// Безопасное форматирование сообщений: только разрешённые BBCode-теги, без HTML.
function formattedText(source){
 const root=el('div','formatted-text'),stack=[{name:'root',node:root}];
 const tokens=String(source||'').split(/(\[\/?(?:b|i|color(?:=#[0-9a-fA-F]{6})?|font(?:=(?:sans|serif|mono))?)\])/gi);
 for(const token of tokens){
  const match=token.match(/^\[(\/)?(b|i|color|font)(?:=(#[0-9a-fA-F]{6}|sans|serif|mono))?\]$/i);
  if(!match){stack[stack.length-1].node.append(document.createTextNode(token));continue}
  const closing=!!match[1],name=match[2].toLowerCase(),value=match[3];
  if(closing){
   if(stack.length>1&&stack[stack.length-1].name===name)stack.pop();
   else stack[stack.length-1].node.append(document.createTextNode(token));
  }else if(stack.length<12&&(name==='b'||name==='i'||(name==='color'&&value?.startsWith('#'))||(name==='font'&&value))){
   const node=document.createElement(name==='b'?'strong':name==='i'?'em':'span');
   if(name==='color')node.style.color=value;
   if(name==='font')node.style.fontFamily=({sans:'Arial, sans-serif',serif:'Georgia, serif',mono:'Consolas, monospace'})[value.toLowerCase()];
   stack[stack.length-1].node.append(node);stack.push({name,node});
  }else stack[stack.length-1].node.append(document.createTextNode(token));
 }
 return root;
}
function formatToolbar(field){
 const bar=el('div','row format-toolbar');
 const editor=el('div','rich-editor');editor.contentEditable='true';editor.setAttribute('role','textbox');editor.setAttribute('aria-label','Текст сообщения');editor.dataset.placeholder=field.placeholder||'Напиши сообщение...';
 editor.style.cssText='width:100%;min-height:125px;border:1px solid var(--line);border-radius:8px;background:#100a18;color:var(--text);padding:12px;outline:none;white-space:pre-wrap;overflow-wrap:anywhere;text-align:left';

 preview.style.cssText='width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:7px;font-size:13px';
 let savedRange=null;
 function remember(){const s=window.getSelection();if(s&&s.rangeCount&&editor.contains(s.anchorNode))savedRange=s.getRangeAt(0).cloneRange()}
 editor.addEventListener('mouseup',remember);editor.addEventListener('keyup',remember);editor.addEventListener('focus',remember);
 function serialize(node){
  if(node.nodeType===3)return node.nodeValue||'';
  if(node.nodeType!==1)return '';
  const tag=node.tagName.toLowerCase();if(tag==='br')return '\n';
  let inner=Array.from(node.childNodes).map(serialize).join('');
  if(tag==='b'||tag==='strong'||node.style?.fontWeight==='bold')inner='[b]'+inner+'[/b]';
  if(tag==='i'||tag==='em'||node.style?.fontStyle==='italic')inner='[i]'+inner+'[/i]';
  const color=node.style?.color||node.getAttribute('color')||'';
  if(color){let hex=/^#[0-9a-f]{6}$/i.test(color)?color:null;const nums=color.match(/\d+/g);if(!hex&&nums?.length>=3)hex='#'+nums.slice(0,3).map(x=>Number(x).toString(16).padStart(2,'0')).join('');if(hex)inner='[color='+hex+']'+inner+'[/color]'}
  const family=(node.style?.fontFamily||node.getAttribute('face')||'').toLowerCase();
  const font=family.includes('consolas')||family.includes('mono')?'mono':family.includes('georgia')||family.includes('serif')&&!family.includes('sans')?'serif':family.includes('arial')?'sans':null;
  if(font)inner='[font='+font+']'+inner+'[/font]';
  return tag==='div'||tag==='p'?inner+'\n':inner;
 }
 const sync=()=>{field.value=Array.from(editor.childNodes).map(serialize).join('').replace(/\n+$/,'');preview.replaceChildren(el('div','muted','Предпросмотр оформления:'),formattedText(field.value||'Здесь появится оформленный текст'));field.dispatchEvent(new Event('input',{bubbles:true}))};
 editor.addEventListener('input',()=>{sync();remember()});
 function cmd(name,value){editor.focus();if(savedRange){const s=window.getSelection();s.removeAllRanges();s.addRange(savedRange)}document.execCommand('styleWithCSS',false,true);document.execCommand(name,false,value);sync();remember()}

const MAX_FILE_SIZE=10*1024*1024;
function formatFileSize(bytes){if(bytes<1024)return bytes+' Б';if(bytes<1024*1024)return (bytes/1024).toFixed(1)+' КБ';return (bytes/1024/1024).toFixed(1)+' МБ'}
async function uploadForumFile(file){
  if(!file)return null;
  if(file.size>MAX_FILE_SIZE)throw new Error('Файл слишком большой. Максимальный размер — 10 МБ.');
  const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path=user.id+'/'+Date.now()+'_'+crypto.randomUUID()+'_'+safeName;
  const {error}=await supabase.storage.from('forum-attachments').upload(path,file,{upsert:false});
  if(error)throw error;
  const {data}=supabase.storage.from('forum-attachments').getPublicUrl(path);
  return {name:file.name,size:file.size,url:data.publicUrl};
}

  }else{
    box.appendChild(link);
  }
  return box;
}

async function openSupportInbox(archive=false){
 if(!user||currentRole!=='admin')return msg('Доступ только для администрации',true);
 view={type:archive?'support-archive':'support-inbox'};
 $('heading').textContent=archive?'🗃 Архив обращений':'📨 Жалобы / вопросы';
 $('content').replaceChildren(back(archive?'В админ-панель':'На форум',archive?openAdminPanel:loadCategories));renderEditor();
 const {data,error}=await supabase.from('forum_support_tickets').select('id,user_id,body,image_url,status,created_at,admin_reply').eq('status',archive?'closed':'open').order('created_at',{ascending:false}).limit(100);
 if(error)return err(error);
 const visibleTickets=(data||[]).filter(t=>!(/заявка на модерацию/i.test(t.body||'')));
 if(!visibleTickets.length)$('content').append(el('p','muted',archive?'В архиве пока нет обращений.':'Новых обращений нет.'));
 for(const t of visibleTickets){
  const p=el('section','panel');const heading=el('div','row');heading.style.cssText='display:flex;align-items:flex-start;justify-content:space-between;gap:12px';
  heading.append(el('h3','',(archive?'✓ В архиве':'🔴 Обращение')+' · '+new Date(t.created_at).toLocaleString('ru-RU')));
  const actions=el('div');actions.style.cssText='display:flex;flex-direction:column;align-items:flex-end;gap:8px';
  const toggle=el('button','btn secondary',archive?'↩ Вернуть':'✓ В архив');
  toggle.onclick=async()=>{toggle.disabled=true;const {data:changed,error}=await supabase.rpc('forum_support_set_archived',{p_ticket_id:t.id,p_archived:!archive});if(error||changed!==true){toggle.disabled=false;return err(error||new Error('Статус не изменён'))}msg(archive?'Возвращено из архива':'Обращение перенесено в архив');await refreshSupportCount();openSupportInbox(archive)};
  actions.append(toggle);
  if(archive&&user?.email?.trim().toLowerCase()==='007.s2@mail.ru'){
   const remove=el('button','btn secondary','🗑 Удалить');remove.style.borderColor='#b94a70';
   remove.onclick=async()=>{if(!confirm('Навсегда удалить это обращение? Восстановить его будет невозможно.'))return;remove.disabled=true;
    const {data:deleted,error}=await supabase.from('forum_support_tickets').delete().eq('id',t.id).eq('status','closed').select('id');
    if(error||!deleted?.length){remove.disabled=false;return err(error||new Error('Удаление запрещено правилами Supabase. Примени SQL-файл.'))}
    msg('Обращение удалено');await refreshSupportCount();openSupportInbox(true);
   };actions.append(remove);
  }
  heading.append(actions);p.append(heading,el('p','muted','Отправитель: '+t.user_id),el('p','',t.body));
  if(t.image_url){const img=el('img');img.src=t.image_url;img.alt='Вложенная картинка';img.loading='lazy';img.style.cssText='max-width:100%;max-height:450px;object-fit:contain;border-radius:8px';p.append(img)}
  if(archive){
   const answer=el('div','panel');answer.style.cssText='margin-top:14px;padding:14px;background:#110b1a';
   answer.append(el('strong','', '💬 Ответ администрации'),el('p','content',t.admin_reply||'Администрация пока не ответила.'));
   p.append(answer);
  }else{
   const reply=el('textarea');reply.placeholder='Ответ администрации (придёт пользователю в уведомления)';reply.maxLength=2000;p.append(reply);
   const send=el('button','btn','Ответить и в архив');send.onclick=async()=>{
    const answer=reply.value.trim();if(!answer)return msg('Напиши ответ перед отправкой',true);send.disabled=true;
    const {error:replyError}=await supabase.rpc('forum_support_reply',{p_ticket_id:t.id,p_body:answer});
    if(replyError){send.disabled=false;return err(replyError)}
    const {error:saveError}=await supabase.from('forum_support_tickets').update({admin_reply:answer}).eq('id',t.id);
    if(saveError){send.disabled=false;return err(new Error('Ответ отправлен, но сохранить его для архива не удалось: '+saveError.message))}
    const {data:archived,error:archiveError}=await supabase.rpc('forum_support_set_archived',{p_ticket_id:t.id,p_archived:true});send.disabled=false;
    if(archiveError||archived!==true)return err(archiveError||new Error('Ответ отправлен, но архивирование не удалось'));
    msg('Ответ отправлен пользователю, обращение в архиве');await refreshSupportCount();openSupportInbox(false);
   };p.append(send);
  }
  $('content').append(p);
 }
}

function openSupportForm(){
 if(!user)return showAuth(true);
 view={type:'support-form'};$('heading').textContent='Задать вопрос / жалобу';$('content').replaceChildren(back('На форум',loadCategories));renderEditor();
 const panel=el('section','panel');panel.append(el('h3','','Задать вопрос или жалобу напрямую администрации'));
 const body=el('textarea');body.placeholder='Напиши вопрос или жалобу...';body.maxLength=3000;panel.append(body);
 const file=el('input');file.type='file';file.accept='image/png,image/jpeg,image/webp';panel.append(file);
 const send=el('button','btn','Отправить администрации');
 send.onclick=async()=>{
  const content=body.value.trim();if(content.length<5)return msg('Напиши сообщение от 5 символов',true);
  const f=file.files?.[0];if(f&&(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>5*1024*1024))return msg('Нужна PNG, JPG или WEBP до 5 МБ',true);
  send.disabled=true;
  try{
   let image_url=null;
   if(f){const a=await uploadForumFile(f);image_url=a.url}
   const {error}=await supabase.from('forum_support_tickets').insert({user_id:user.id,body:content,image_url});
   if(error)throw error;msg('Сообщение отправлено администрации');openCommunity('home');
  }catch(e){err(e)}finally{send.disabled=false}
 };
 panel.append(send);$('content').append(panel);
}

async function openProfile(id){const previous={...view};view={type:'profile',id};$('heading').textContent='Профиль игрока';$('content').replaceChildren(back('Назад',()=>previous.type==='topic'?openTopic(previous.id,previous.categoryId):previous.type==='category'?openCategory(previous.id):loadCategories()));renderEditor();const {data,error}=await supabase.from('profiles').select('id,nickname,avatar_url,banner_url,bio,xp,role,verified,verified_pending').eq('id',id).maybeSingle();if(error)return err(error);if(!data){$('content').append(el('p','muted','Профиль не найден.'));return}const p=el('section','panel');const ownerProfile=isProjectOwner(id);const nickHeading=el('h3','',data.nickname||'Игрок');if(ownerProfile)appendProjectOwnerMark(nickHeading,true,false);if(data.role==='admin'&&!ownerProfile)appendAdminCrown(nickHeading);appendVerificationMark(nickHeading,!!data.verified,!!data.verified_pending,'8px');p.append(nickHeading,el('p','muted',ownerProfile?'🧟 ProjectZ развитие':data.verified?'Администратор сервера':data.role==='admin'?'👑 Помощник проекта':'Роль: '+(data.role||'player')));if(data.avatar_url){const img=el('img');img.src=data.avatar_url;img.alt='Аватар';img.style.cssText='width:96px;height:96px;object-fit:cover;border-radius:50%';p.prepend(img)}if(data.banner_url){const banner=el('img');banner.src=data.banner_url;banner.alt='Баннер профиля';banner.style.cssText='width:100%;max-height:180px;object-fit:cover;border-radius:10px';p.prepend(banner)}const bioText=el('p','',data.bio||'');bioText.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0';p.append(bioText);const levelRow=el('div','row');const levelInfo=el('p','muted','XP: '+(data.xp||0)+' · Уровень '+(Math.floor((data.xp||0)/100)+1));levelInfo.style.margin='10px 0';levelRow.append(levelInfo);if(user?.id===id&&data.verified_pending&&!data.verified){const confirmBadge=el('button','btn','Подтвердить');confirmBadge.type='button';confirmBadge.onclick=async()=>{confirmBadge.disabled=true;try{const {error}=await supabase.rpc('forum_confirm_verification');if(error)throw error;msg('Галочка подтверждена!');renderAuth();await openProfile(id)}catch(error){err(error);confirmBadge.disabled=false}};nickHeading.append(confirmBadge)}p.append(levelRow);if(user&&user.id!==id){const dm=el('button','btn secondary','✉ Написать сообщение');dm.onclick=()=>openCommunity('messages',id);p.append(dm)}$('content').append(p);if(user?.id===id){const aboutForm=el('form');aboutForm.style.cssText='margin:14px 0;display:grid;gap:8px';const aboutLabel=el('label','','О себе');const about=el('textarea');about.value=data.bio||'';about.maxLength=200;about.rows=3;about.placeholder='Коротко расскажи о себе (до 200 символов)';about.style.width='100%';const aboutCount=el('small','muted',`${about.value.length}/200 символов`);aboutCount.style.cssText='display:block;text-align:right;margin-top:-4px';about.addEventListener('input',()=>{aboutCount.textContent=`${about.value.length}/200 символов`});const saveAbout=el('button','btn','Сохранить информацию о себе');saveAbout.type='submit';saveAbout.style.cssText='width:fit-content;justify-self:start';aboutForm.append(aboutLabel,about,aboutCount,saveAbout);aboutForm.onsubmit=async e=>{e.preventDefault();const bio=about.value.trim();if(bio.length>200){msg('Раздел «О себе» ограничен 200 символами.',true);return}saveAbout.disabled=true;const ok=await communityAction('profile',{bio,avatar_url:data.avatar_url||'',banner_url:data.banner_url||''});saveAbout.disabled=false;if(!ok)return;await openProfile(id)};p.append(aboutForm);const form=el('form');const name=el('input');name.value=data.nickname||'';name.maxLength=40;name.required=true;name.placeholder='Только текст, без смайликов';name.autocomplete='nickname';name.addEventListener('input',()=>{const pos=name.selectionStart;const clean=name.value.replace(/[^\\p{L}\\p{N} _.-]/gu,'');if(clean!==name.value){name.value=clean;name.setSelectionRange(Math.min(pos,clean.length),Math.min(pos,clean.length))}});const save=el('button','btn','Сохранить ник');form.append(el('label','','Изменить ник'),name,save);form.onsubmit=async e=>{e.preventDefault();const nickname=name.value.trim();if(!nickname||nickname.length>40||!/^[\\p{L}\\p{N} _.-]+$/u.test(nickname)){msg('В нике разрешены только буквы, цифры, пробелы, точка, дефис и подчёркивание. Смайлики запрещены.',true);return}save.disabled=true;const {error}=await supabase.from('profiles').update({nickname}).eq('id',id);save.disabled=false;if(error)return err(error);msg('Ник сохранён');openProfile(id)};p.append(form);const upload=el('input');upload.type='file';upload.accept='image/png,image/jpeg,image/webp';const up=el('button','btn secondary','📷 Загрузить аватар');up.onclick=async()=>{const file=upload.files?.[0];if(!file)return msg('Выбери изображение',true);if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>10*1024*1024)return msg('Нужен PNG/JPG/WEBP до 10 МБ',true);try{const a=await uploadForumFile(file);if(await communityAction('profile',{bio:data.bio||'',avatar_url:a.url,banner_url:data.banner_url||''}))openProfile(id)}catch(e){err(e)}};p.append(upload,up)}}

 }catch(e){console.warn('Не удалось восстановить открытую вкладку форума:',e)}

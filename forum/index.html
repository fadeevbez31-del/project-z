const $=id=>document.getElementById(id);let user=null,mode='login',pendingEmail='',view={type:'categories'},categories=[],profiles={},currentRole='player';

function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n}

// Безопасное форматирование сообщений: только разрешённые BBCode-теги, без HTML.
function formattedText(source){
 const root=el('div','formatted-text'),stack=[{name:'root',node:root}];
 const tokens=String(source||'').split(/(\[\/?(?:b|i|color(?:=#[0-9a-fA-F]{6})?|font(?:=(?:sans|serif|mono))?)\])/gi);
 for(const token of tokens){
  const match=token.match(/^\[(\/)?(b|i|color|font)(?:=(#[0-9a-fA-F]{6}|sans|serif|mono))?\]$/i);
  if(!match){stack[stack.length-1].node.append(document.createTextNode(token));continue}
  const closing=!!match[1],name=match[2].toLowerCase(),value=match[3];
  if(closing){
   if(stack.length>1&&stack[stack.length-1].name===name)stack.pop();
   else stack[stack.length-1].node.append(document.createTextNode(token));
  }else if(stack.length<12&&(name==='b'||name==='i'||(name==='color'&&value?.startsWith('#'))||(name==='font'&&value))){
   const node=document.createElement(name==='b'?'strong':name==='i'?'em':'span');
   if(name==='color')node.style.color=value;
   if(name==='font')node.style.fontFamily=({sans:'Arial, sans-serif',serif:'Georgia, serif',mono:'Consolas, monospace'})[value.toLowerCase()];
   stack[stack.length-1].node.append(node);stack.push({name,node});
  }else stack[stack.length-1].node.append(document.createTextNode(token));
 }
 return root;
}
function formatToolbar(field){
 const bar=el('div','row format-toolbar');
 const apply=(start,end)=>{
  const a=field.selectionStart,b=field.selectionEnd,chosen=field.value.slice(a,b);
  const insert=start+chosen+end;
  if(field.value.length+start.length+end.length>field.maxLength)return msg('Превышен лимит длины сообщения',true);
  field.setRangeText(insert,a,b,'select');field.dispatchEvent(new Event('input',{bubbles:true}));field.focus();field.setSelectionRange(a+start.length,a+start.length+chosen.length);
 };
 const bold=el('button','btn secondary','Жирный');bold.type='button';bold.onclick=()=>apply('[b]','[/b]');bar.append(bold);
 const italic=el('button','btn secondary','Курсив');italic.type='button';italic.onclick=()=>apply('[i]','[/i]');bar.append(italic);
 const font=el('select');font.setAttribute('aria-label','Шрифт');
 for(const [value,label] of [['','Шрифт'],['sans','Обычный'],['serif','С засечками'],['mono','Моноширинный']]){const option=el('option','',label);option.value=value;font.append(option)}
 font.onchange=()=>{if(font.value)apply('[font='+font.value+']','[/font]');font.value=''};bar.append(font);
 const color=el('input');color.type='color';color.value='#c98aff';color.title='Цвет текста';color.setAttribute('aria-label','Цвет текста');
 const paint=el('button','btn secondary','Цвет');paint.type='button';paint.onclick=()=>apply('[color='+color.value+']','[/color]');bar.append(color,paint);
 const preview=el('div','panel formatted-preview');preview.style.cssText='width:100%;margin-top:8px;padding:12px;min-height:48px';
 const previewTitle=el('div','muted','Предпросмотр оформления:');
 const updatePreview=()=>{preview.replaceChildren(previewTitle,formattedText(field.value||'Здесь появится оформленный текст'))};
 field.addEventListener('input',updatePreview);
 bar.append(preview);updatePreview();
 return bar;
}

function msg(text,error=false){$('notice').replaceChildren(el('p',error?'error':'success',text));}
function err(e){msg(e?.message||'Произошла ошибка',true)}
$('topicBody').before(formatToolbar($('topicBody')));
const MAX_FILE_SIZE=10*1024*1024;
function formatFileSize(bytes){if(bytes<1024)return bytes+' Б';if(bytes<1024*1024)return (bytes/1024).toFixed(1)+' КБ';return (bytes/1024/1024).toFixed(1)+' МБ'}
async function uploadForumFile(file){
  if(!file)return null;
  if(file.size>MAX_FILE_SIZE)throw new Error('Файл слишком большой. Максимальный размер — 10 МБ.');
  const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path=user.id+'/'+Date.now()+'_'+crypto.randomUUID()+'_'+safeName;
  const {error}=await supabase.storage.from('forum-attachments').upload(path,file,{upsert:false});
  if(error)throw error;
  const {data}=supabase.storage.from('forum-attachments').getPublicUrl(path);
  return {name:file.name,size:file.size,url:data.publicUrl};
}
function attachmentHtml(a){
  if(!a || !a.url)return null;
  const box=el('div','panel');
  box.style.marginTop='14px';
  box.style.padding='12px';
  const link=el('a','', '📎 '+(a.name||'Файл')+' ('+formatFileSize(a.size||0)+')');
  link.href=a.url;
  link.target='_blank';
  link.rel='noopener noreferrer';
  const name=String(a.name||'').toLowerCase();
  const isImage=['.png','.jpg','.jpeg','.gif','.webp','.avif','.bmp','.svg'].some(ext=>name.endsWith(ext));
  if(isImage){
    const preview=el('img');
    preview.src=a.url;
    preview.alt=a.name||'Изображение';
    preview.loading='lazy';
    preview.style.cssText='display:block;max-width:100%;max-height:650px;width:auto;height:auto;object-fit:contain;border-radius:9px;margin:0 auto;';
    const imageLink=el('a');
    imageLink.href=a.url;
    imageLink.target='_blank';
    imageLink.rel='noopener noreferrer';
    imageLink.appendChild(preview);
    box.appendChild(imageLink);
    preview.onerror=function(){imageLink.replaceWith(link);};
  }else{
    box.appendChild(link);
  }
  return box;
}
function showAuth(visible){$('authPanel').classList.toggle('hidden',!visible)}
function authMode(next){mode=next;$('authSubmit').textContent=mode==='login'?'Войти':'Зарегистрироваться';$('nicknameRow').classList.toggle('hidden',mode!=='signup');$('nickname').required=mode==='signup';$('password').autocomplete=mode==='signup'?'new-password':'current-password';$('authHint').textContent=mode==='login'?'Введите email и пароль.':'После регистрации на почту придёт шестизначный код.';}

$('otpForm').onsubmit=async e=>{e.preventDefault();const token=$('otpCode').value.trim();if(!/^\d{6}$/.test(token))return msg('Введи шесть цифр из письма.',true);const button=$('otpSubmit');button.disabled=true;try{const {error}=await supabase.auth.verifyOtp({email:pendingEmail,token,type:'signup'});if(error)throw error;$('otpPanel').classList.add('hidden');msg('Почта подтверждена! Ты вошёл на форум.')}catch(error){err(error)}finally{button.disabled=false}};
$('otpResend').onclick=async()=>{const button=$('otpResend');button.disabled=true;try{const {error}=await supabase.auth.resend({type:'signup',email:pendingEmail});if(error)throw error;msg('Если повторная отправка разрешена, новый код отправлен.')}catch(error){err(error)}finally{button.disabled=false}};
$('otpCancel').onclick=()=>{$('otpPanel').classList.add('hidden');pendingEmail='';showAuth(true)};
supabase.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;currentRole='player';renderAuth();refreshRole();});

async function openSupportInbox(){
 if(!user||currentRole!=='admin')return msg('Доступ только для администрации',true);
 view={type:'support-inbox'};$('heading').textContent='📨 Жалобы / вопросы';$('content').replaceChildren(back('На форум',loadCategories));renderEditor();

 if(error)return err(error);
 for(const t of data||[]){

  const reply=el('textarea');reply.placeholder='Ответ администрации (придёт пользователю в уведомления)';reply.maxLength=2000;p.append(reply);
  const send=el('button','btn','Отправить ответ');send.onclick=async()=>{if(!reply.value.trim())return;send.disabled=true;const {error}=await supabase.rpc('forum_support_reply',{p_ticket_id:t.id,p_body:reply.value.trim()});send.disabled=false;if(error)return err(error);msg('Ответ отправлен в уведомления');openSupportInbox()};p.append(send);
  if(t.status==='open'){const done=el('button','btn secondary','Отметить обработанным');done.onclick=async()=>{const {error}=await supabase.from('forum_support_tickets').update({status:'closed'}).eq('id',t.id);if(error)return err(error);openSupportInbox()};p.append(done)}
  $('content').append(p);
 }
}

function openSupportForm(){
 if(!user)return showAuth(true);
 view={type:'support-form'};$('heading').textContent='Задать вопрос / жалобу';$('content').replaceChildren(back('На форум',loadCategories));renderEditor();
 const panel=el('section','panel');panel.append(el('h3','','Задать вопрос или жалобу напрямую администрации'));
 const body=el('textarea');body.placeholder='Напиши вопрос или жалобу...';body.maxLength=3000;panel.append(body);
 const file=el('input');file.type='file';file.accept='image/png,image/jpeg,image/webp';panel.append(file);
 const send=el('button','btn','Отправить администрации');
 send.onclick=async()=>{
  const content=body.value.trim();if(content.length<5)return msg('Напиши сообщение от 5 символов',true);
  const f=file.files?.[0];if(f&&(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>5*1024*1024))return msg('Нужна PNG, JPG или WEBP до 5 МБ',true);
  send.disabled=true;
  try{
   let image_url=null;
   if(f){const a=await uploadForumFile(f);image_url=a.url}
   const {error}=await supabase.from('forum_support_tickets').insert({user_id:user.id,body:content,image_url});
   if(error)throw error;msg('Сообщение отправлено администрации');openCommunity('home');
  }catch(e){err(e)}finally{send.disabled=false}
 };
 panel.append(send);$('content').append(panel);
}

async function loadCategories(){view={type:'categories'};$('heading').textContent='Разделы форума';$('content').replaceChildren();renderEditor();const {data,error}=await supabase.from('forum_categories').select('id,name,description,icon,sort_order,is_hidden').order('sort_order');if(error)return err(error);categories=data||[];if(!categories.length)$('content').append(el('p','muted','Категорий пока нет.'));for(const c of categories.filter(x=>!x.is_hidden||currentRole==='admin')){const card=el('article','category');card.append(el('h3','',`${c.icon||'💬'} ${c.name}`),el('div','muted',c.description||''));card.onclick=()=>openCategory(c.id);$('content').append(card)}}
async function openCategory(id){view={type:'category',id};const c=categories.find(x=>x.id===id);$('heading').textContent=c?.name||'Темы';$('content').replaceChildren(back('Все разделы',loadCategories));renderEditor();const {data,error}=await supabase.from('forum_topics').select('id,title,body,author_id,created_at,views,pinned,locked').eq('category_id',id).order('pinned',{ascending:false}).order('created_at',{ascending:false}).limit(100);if(error)return err(error);if(!data?.length)$('content').append(el('p','muted','Тем пока нет. Зарегистрируйся и создай первую!'));for(const t of data||[]){const card=el('article','topic');card.append(el('h3','',(t.pinned?'📌 ':'')+(t.locked?'🔒 ':'')+t.title),el('div','muted',new Date(t.created_at).toLocaleString('ru-RU')+' · 👁 '+(t.views||0)));card.onclick=()=>openTopic(t.id,id);if(canDelete(t.author_id,id)){card.append(deleteButton('Удалить тему',async()=>{const {data,error}=await supabase.from('forum_topics').delete().eq('id',t.id).select('id');if(error)return err(error);if(!data?.length)return msg('Удаление запрещено политикой доступа Supabase.',true);msg('Тема удалена');await openCategory(id)}))}$('content').append(card)}}
async function openTopic(id,categoryId){view={type:'topic',id,categoryId};$('heading').textContent='Тема форума';$('content').replaceChildren(back('К темам',()=>openCategory(categoryId)));renderEditor();const {data:t,error}=await supabase.from('forum_topics').select('id,title,body,author_id,created_at,views,pinned,locked').eq('id',id).single();if(error)return err(error);const viewKey='pz-view-'+id;const firstView=!sessionStorage.getItem(viewKey);if(firstView){sessionStorage.setItem(viewKey,'1');supabase.rpc('forum_increment_topic_views',{topic_id:String(id)}).then(({error})=>{if(error)console.warn('Счётчик просмотров:',error.message)});} $('heading').textContent=t.title+' · 👁 '+((t.views||0)+(firstView?1:0));$('heading').style.fontWeight='800';const panel=el('section','panel');const author=el('button','btn secondary','Профиль автора');author.onclick=()=>openProfile(t.author_id);if(canDelete(t.author_id,categoryId))panel.append(deleteButton('Удалить тему',async()=>{const {data,error}=await supabase.from('forum_topics').delete().eq('id',id).select('id');if(error)return err(error);if(!data?.length)return msg('Удаление запрещено политикой доступа Supabase.',true);msg('Тема удалена');await openCategory(categoryId)}));let topicBody=t.body||'',attachment=null;
const marker='[[ATTACHMENT]]';
const markerPos=topicBody.lastIndexOf(marker);
if(markerPos!==-1){
  try{
    const raw=topicBody.slice(markerPos+marker.length).replace(/^(?:\\n|\s)+/g,'').trim();
    const parsed=JSON.parse(raw);
    if(parsed&&typeof parsed.url==='string'){
      attachment=parsed;
      topicBody=topicBody.slice(0,markerPos).replace(/(?:\\n|\s)+$/g,'').trim();
    }
  }catch(e){console.warn('Не удалось прочитать вложение:',e)}
}
panel.append(author,el('p','muted',new Date(t.created_at).toLocaleString('ru-RU')),formattedText(topicBody));
const attachmentBox=attachmentHtml(attachment);if(attachmentBox)panel.append(attachmentBox);$('content').append(panel);
if(user){const actions=el('div','row');panel.append(actions);
for(const emoji of ['👍','❤️','🔥','💀']){const b=el('button','btn secondary',emoji);b.onclick=async()=>{if(await communityAction('reaction',{id:String(id),emoji}))openTopic(id,categoryId)};actions.append(b)}
const fav=el('button','btn secondary','⭐ В избранное');fav.onclick=async()=>{if(await communityAction('favorite',{id:String(id)}))msg('Тема добавлена в избранное')};actions.append(fav);
if(t.author_id===user.id||currentRole==='admin'){const edit=el('button','btn secondary','✏ Изменить тему');edit.onclick=async()=>{const body=prompt('Новый текст темы (без изменения вложений):',topicBody);if(body&&await communityAction('edit_topic',{id:String(id),body}))openTopic(id,categoryId)};actions.append(edit)}
const {data:reacts}=await supabase.from('forum_reactions').select('emoji').eq('topic_id',String(id));if(reacts?.length)panel.append(el('p','muted','Реакции: '+reacts.map(x=>x.emoji).join(' ')));
}const replies=el('section','panel');replies.append(el('h3','','Ответы'+(t.locked?' · 🔒 Тема закрыта':'')));$('content').append(replies);const {data:items,error:re}=await supabase.from('forum_replies').select('id,body,author_id,created_at').eq('topic_id',id).order('created_at');if(re)return err(re);for(const r of items||[]){const p=el('div','post');const authorButton=el('button','btn secondary','Автор ответа');authorButton.onclick=()=>openProfile(r.author_id);p.append(authorButton,el('span','muted',' '+new Date(r.created_at).toLocaleString('ru-RU')),formattedText(r.body));if(canDelete(r.author_id,categoryId))p.append(deleteButton('Удалить ответ',async()=>{const {data,error}=await supabase.from('forum_replies').delete().eq('id',r.id).select('id');if(error)return err(error);if(!data?.length)return msg('Удаление запрещено политикой доступа Supabase.',true);msg('Ответ удалён');await openTopic(id,categoryId)}));if(user&&(r.author_id===user.id||currentRole==='admin')){const edit=el('button','btn secondary','✏ Редактировать');edit.onclick=async()=>{const body=prompt('Новый текст ответа',r.body);if(body&&await communityAction('edit_reply',{id:String(r.id),body}))openTopic(id,categoryId)};p.append(edit)}replies.append(p)}if(user&&(!t.locked||currentRole==='admin')){const form=el('form');const field=el('textarea');field.required=true;field.maxLength=15000;field.placeholder='Напиши ответ...';const submit=el('button','btn','Ответить');form.append(formatToolbar(field),field,submit);form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;const {error}=await supabase.from('forum_replies').insert({topic_id:id,author_id:user.id,body:field.value.trim()});submit.disabled=false;if(error)return err(error);msg('Ответ добавлен');openTopic(id,categoryId)};replies.append(form)}else replies.append(el('p','muted',t.locked?'Тема закрыта для ответов.':'Войди, чтобы ответить.'));if(user){const report=el('button','btn secondary','🚩 Пожаловаться');report.onclick=async()=>{const reason=prompt('Опиши нарушение (не менее 5 символов):');if(!reason||reason.trim().length<5)return;const {error}=await supabase.from('forum_reports').insert({reporter_id:user.id,topic_id:String(id),reason:reason.trim().slice(0,1000)});if(error)return err(error);msg('Жалоба отправлена администрации')};panel.append(report)}}
async function adminAction(action,data){
 const {error}=await supabase.rpc('forum_admin_action',{p_action:action,p_data:data});
 if(error){err(error);return false}
 msg('Изменения сохранены');return true;
}
function adminButton(parent,label,callback){const b=el('button','btn secondary',label);b.style.margin='4px';b.onclick=callback;parent.append(b)}
function adminSection(title){const p=el('section','panel');p.append(el('h3','',title));$('content').append(p);return p}
async function openAdminPanel(){
 if(!user||currentRole!=='admin')return msg('Доступ только для администраторов.',true);
 view={type:'admin'};$('heading').textContent='⚙ Админ-панель PROJECT Z';$('content').replaceChildren(back('К разделам',loadCategories));renderEditor();
 const tabs=el('div','row');$('content').append(tabs);
 for(const [name,label] of [['stats','📊 Статистика'],['topics','📌 Темы'],['users','👥 Пользователи'],['categories','📁 Разделы'],['reports','🚩 Жалобы'],['requests','📨 Заявки'],['bans','⛔ Баны'],['logs','📜 Журнал'],['sourcebans','🎮 SourceBans']]){
  adminButton(tabs,label,()=>adminTab(name));

}
async function adminTab(tab){
 if(currentRole!=='admin')return;
 document.querySelectorAll('[data-admin-tab]').forEach(n=>n.remove());
 const wrap=el('div');wrap.dataset.adminTab=tab;$('content').append(wrap);
 const oldContent=$('content');
 const section=(title)=>{const p=el('section','panel');p.append(el('h3','',title));wrap.append(p);return p};
 const addAction=(parent,label,action,data)=>adminButton(parent,label,async()=>{if(await adminAction(action,data))adminTab(tab)});
 if(tab==='stats'){
  const p=section('Статистика форума');
  const tables=['profiles','forum_topics','forum_replies','forum_categories','forum_reports'];
  const names=['Пользователей','Тем','Ответов','Разделов','Жалоб'];
  for(let i=0;i<tables.length;i++){const {count,error}=await supabase.from(tables[i]).select('*',{count:'exact',head:true});p.append(el('p','',names[i]+': '+(error?'нет доступа':count)))}
 }else if(tab==='topics'){
  const p=section('Темы · последние 100');
  const {data,error}=await supabase.from('forum_topics').select('id,title,category_id,pinned,locked,views').order('created_at',{ascending:false}).limit(100);
  if(error)return err(error);
  for(const t of data||[]){const row=el('div','admin-entry');row.append(el('strong','',t.title),el('p','muted','👁 '+(t.views||0)));
   addAction(row,t.pinned?'Открепить':'📌 Закрепить','topic_pin',{id:String(t.id),value:!t.pinned});
   addAction(row,t.locked?'Открыть':'🔒 Закрыть','topic_lock',{id:String(t.id),value:!t.locked});
   adminButton(row,'Переименовать',async()=>{const title=prompt('Новое название',t.title);if(title&&await adminAction('topic_rename',{id:String(t.id),title}))adminTab(tab)});
   adminButton(row,'Удалить',async()=>{if(confirm('Удалить тему?')&&await adminAction('topic_delete',{id:String(t.id)}))adminTab(tab)});
   p.append(row);
  }
 }else if(tab==='users'){
  const p=section('Пользователи и роли · до 100');
  const search=el('input');search.placeholder='Поиск по нику';p.append(search);
  const list=el('div');p.append(list);
  const {data,error}=await supabase.from('profiles').select('id,nickname,role').order('nickname').limit(100);
  if(error)return err(error);
  const draw=()=>{list.replaceChildren();for(const u of (data||[]).filter(x=>(x.nickname||'').toLowerCase().includes(search.value.toLowerCase()))){
   const row=el('div','admin-entry');row.append(el('strong','',u.nickname||u.id),el('p','muted','Роль: '+(u.role||'player')));
   const isOwner=user?.email?.toLowerCase()==='007.s2@mail.ru';
   if(isOwner && u.id!==user.id){
     if(u.role==='admin'){
       adminButton(row,'🔒 Забрать админку',async()=>{
         if(!confirm('Забрать админку у '+(u.nickname||u.id)+'?'))return;
         if(await adminAction('user_role',{user_id:u.id,role:'player'}))adminTab(tab);
       });
     }else{
       adminButton(row,'👑 Выдать админку',async()=>{
         if(!confirm('Выдать админку пользователю '+(u.nickname||u.id)+'?'))return;
         if(await adminAction('user_role',{user_id:u.id,role:'admin'}))adminTab(tab);
       });
     }
   }
   if(u.role!=='admin')adminButton(row,'Изменить роль',async()=>{const role=prompt('Новая роль: player, vip, moderator',u.role||'player');if(!role)return;const next=role.trim().toLowerCase();if(!['player','vip','moderator'].includes(next))return msg('Недопустимая роль',true);if(await adminAction('user_role',{user_id:u.id,role:next}))adminTab(tab)});
   adminButton(row,'Заблокировать',async()=>{const reason=prompt('Причина блокировки');if(reason&&await adminAction('user_ban',{user_id:u.id,reason}))adminTab(tab)});
   list.append(row);
  }};search.oninput=draw;draw();
 }else if(tab==='categories'){
  const p=section('Разделы форума');
  adminButton(p,'+ Новый раздел',async()=>{const name=prompt('Название нового раздела');if(name&&await adminAction('category_create',{name}))adminTab(tab)});
  const {data,error}=await supabase.from('forum_categories').select('id,name,is_hidden').order('sort_order');if(error)return err(error);
  for(const c of data||[]){const row=el('div','admin-entry');row.append(el('strong','',c.name));
   adminButton(row,'Переименовать',async()=>{const name=prompt('Название',c.name);if(name&&await adminAction('category_rename',{id:String(c.id),name}))adminTab(tab)});
   addAction(row,c.is_hidden?'Показать':'Скрыть','category_hide',{id:String(c.id),value:!c.is_hidden});
   adminButton(row,'Удалить',async()=>{if(confirm('Удалить пустой раздел?')&&await adminAction('category_delete',{id:String(c.id)}))adminTab(tab)});
   p.append(row);
  }
 }else if(tab==='reports'){
  const p=section('Жалобы игроков');
  const {data,error}=await supabase.from('forum_reports').select('id,topic_id,reason,status,created_at').order('created_at',{ascending:false}).limit(100);if(error)return err(error);
  for(const r of data||[]){const row=el('div','admin-entry');row.append(el('strong','','Тема '+r.topic_id+' · '+r.status),el('p','',r.reason));
   addAction(row,'Рассмотрено','report_status',{id:String(r.id),status:'resolved'});
   addAction(row,'Отклонить','report_status',{id:String(r.id),status:'rejected'});p.append(row);
  }
  }else if(tab==='requests'){
  const p=section('Заявки VIP / Разбан');
  const {data,error}=await supabase.from('forum_requests').select('id,author_id,kind,steam_id,body,status,created_at').order('created_at',{ascending:false}).limit(100);
  if(error)return err(error);
  for(const r of data||[]){const row=el('div','admin-entry');row.append(el('strong','',r.kind.toUpperCase()+' · '+r.steam_id+' · '+r.status),el('p','',r.body),el('p','muted','Автор: '+r.author_id));
    adminButton(row,'Одобрить',async()=>{if(await communityAction('request_status',{id:String(r.id),status:'approved'}))adminTab(tab)});
    adminButton(row,'Отклонить',async()=>{if(await communityAction('request_status',{id:String(r.id),status:'rejected'}))adminTab(tab)});
    p.append(row);
  }
 }else if(tab==='bans'){
  const p=section('Блокировки форума');
  const {data,error}=await supabase.from('forum_bans').select('user_id,reason,expires_at,created_at').order('created_at',{ascending:false}).limit(100);if(error)return err(error);
  for(const b of data||[]){const row=el('div','admin-entry');row.append(el('strong','',b.user_id),el('p','',b.reason));addAction(row,'Разблокировать','user_unban',{user_id:b.user_id});p.append(row)}
 }else if(tab==='logs'){
  const p=section('Журнал действий');
  const {data,error}=await supabase.from('forum_admin_log').select('actor_id,action,target,created_at').order('created_at',{ascending:false}).limit(100);if(error)return err(error);
  for(const x of data||[])p.append(el('p','muted',new Date(x.created_at).toLocaleString('ru-RU')+' · '+x.action+' · '+(x.target||'')+' · '+(x.actor_id||'')));
 }else if(tab==='sourcebans'){
  const p=section('SourceBans · игровой сервер');
  p.append(el('p','muted','Игровые баны хранятся отдельно от блокировок форума. Для управления ими используйте SourceBans; форум не получает пароли MySQL.'));
  const link=el('a','','Открыть SourceBans ↗');link.href='https://bans.projectz.site/';link.target='_blank';link.rel='noopener noreferrer';p.append(link);
 }
}
async function communityAction(action,data){
 const {error}=await supabase.rpc('forum_community_action',{p_action:action,p_data:data});
 if(error){err(error);return false}msg('Готово');return true;
}
function communityNav(label,fn){const b=el('button','btn secondary',label);b.onclick=fn;return b}
async function openCommunity(section='home'){
 if(!user)return msg('Войди в аккаунт, чтобы использовать функции сообщества.',true);
 view={type:'community'};$('heading').textContent='🎮 PROJECT Z · Сообщество';
 $('content').replaceChildren(back('На форум',loadCategories));renderEditor();
 const nav=el('div','row');$('content').append(nav);
 for(const [label,slug] of [['⭐ Избранное','favorites'],['🔔 Уведомления','notifications'],['✉ Сообщения','messages'],['🔎 Поиск','search'],['🏆 Рейтинг','leaderboard'],['🗺 Карты','maps'],['💎 VIP / Разбан','requests'],['🎖 Достижения','achievements'],['📨 Задать вопрос / жалобу','support']]){
 nav.append(communityNav(label,()=>openCommunity(slug)))}
 const p=el('section','panel');$('content').append(p);
 const heading=t=>p.append(el('h3','',t));
 const line=t=>p.append(el('p','muted',t));
 if(section==='support'){openSupportForm();return}if(section==='home'){heading('Возможности игроков');line('Выбери раздел выше. За создание тем и ответы начисляется XP.');return}
 if(section==='favorites'){
  heading('Избранные темы');const {data,error}=await supabase.from('forum_favorites').select('topic_id').eq('user_id',user.id).order('created_at',{ascending:false}).limit(100);if(error)return err(error);
  for(const x of data||[]){const {data:t}=await supabase.from('forum_topics').select('id,title,category_id').eq('id',x.topic_id).maybeSingle();if(!t)continue;const row=el('div','row');row.append(communityNav('⭐ '+t.title,()=>openTopic(t.id,t.category_id)),communityNav('Убрать',async()=>{if(await communityAction('unfavorite',{id:String(t.id)}))openCommunity('favorites')}));p.append(row)}
 }else if(section==='notifications'){
  heading('Уведомления');const {data,error}=await supabase.from('forum_notifications').select('id,body,topic_id,read_at,created_at').order('created_at',{ascending:false}).limit(100);if(error)return err(error);
  for(const n of data||[]){const row=el('div','admin-entry');row.append(el('p','',(!n.read_at?'● ':'')+n.body+' · '+new Date(n.created_at).toLocaleString('ru-RU')));if(!n.read_at)row.append(communityNav('Прочитано',async()=>{if(await communityAction('notification_read',{id:String(n.id)}))openCommunity('notifications')}));p.append(row)}
 }else if(section==='messages'){
  heading('Личные сообщения');const {data,error}=await supabase.from('forum_messages').select('sender_id,recipient_id,body,created_at').order('created_at',{ascending:false}).limit(100);if(error)return err(error);
  for(const m of data||[])p.append(el('p','post',(m.sender_id===user.id?'Отправлено: ':'Получено: ')+m.body+' · '+new Date(m.created_at).toLocaleString('ru-RU')));
  const uid=el('input');uid.placeholder='UUID получателя (можно также открыть его профиль)';const body=el('textarea');body.placeholder='Текст сообщения';p.append(uid,body,communityNav('Отправить',async()=>{if(await communityAction('message',{recipient_id:uid.value.trim(),body:body.value}))openCommunity('messages')}));
 }else if(section==='search'){
  heading('Поиск по темам');const input=el('input');input.placeholder='Название или текст темы';p.append(input);
  const results=el('div');p.append(results);p.append(communityNav('Найти',async()=>{const q=input.value.trim();if(q.length<2)return msg('Введите минимум 2 символа',true);results.replaceChildren();const {data,error}=await supabase.from('forum_topics').select('id,title,category_id').ilike('title','%'+q.replace(/[%,]/g,'')+'%').limit(50);if(error)return err(error);for(const t of data||[])results.append(communityNav(t.title,()=>openTopic(t.id,t.category_id)))}));
 }else if(section==='leaderboard'){
  heading('Рейтинг игроков');const {data,error}=await supabase.from('profiles').select('id,nickname,xp').order('xp',{ascending:false}).limit(50);if(error)return err(error);
  (data||[]).forEach((x,i)=>p.append(communityNav((i+1)+'. '+(x.nickname||'Игрок')+' — '+x.xp+' XP',()=>openProfile(x.id))));
 }else if(section==='achievements'){
  heading('Мои достижения');const {data,error}=await supabase.from('forum_achievements').select('code,earned_at').eq('user_id',user.id);if(error)return err(error);
  for(const a of data||[])line('🎖 '+a.code+' · '+new Date(a.earned_at).toLocaleDateString('ru-RU'));if(!data?.length)line('Пока нет достижений. Создай тему или ответь игроку.');
 }else if(section==='maps'){
  heading('Голосование за карты');line('Один голос за каждую карту от аккаунта.');
  const input=el('input');input.placeholder='Название карты, например ze_example';p.append(input,communityNav('Проголосовать',async()=>{if(await communityAction('map_vote',{map_name:input.value.trim()}))openCommunity('maps')}));
  const {data,error}=await supabase.from('forum_map_votes').select('map_name,user_id').limit(1000);if(error)return err(error);const counts={};for(const v of data||[])counts[v.map_name]=(counts[v.map_name]||0)+1;
  Object.entries(counts).sort((a,b)=>b[1]-a[1]).forEach(([name,count])=>p.append(el('p','',name+' · '+count+' голосов')));
 }else if(section==='requests'){
  heading('Заявка на VIP / Разбан');const kind=el('select');for(const [v,t] of [['vip','VIP'],['unban','Разбан']]){const o=el('option','',t);o.value=v;kind.append(o)}
  const steam=el('input');steam.placeholder='SteamID';const body=el('textarea');body.placeholder='Опиши заявку (от 10 символов)';p.append(kind,steam,body,communityNav('Отправить заявку',async()=>{if(await communityAction('request',{kind:kind.value,steam_id:steam.value,body:body.value}))openCommunity('requests')}));
  const {data,error}=await supabase.from('forum_requests').select('kind,steam_id,status,created_at').eq('author_id',user.id).order('created_at',{ascending:false}).limit(30);if(error)return err(error);
  for(const r of data||[])line(r.kind.toUpperCase()+' · '+r.steam_id+' · '+r.status);
 }
}
async function openProfile(id){const previous={...view};view={type:'profile',id};$('heading').textContent='Профиль игрока';$('content').replaceChildren(back('Назад',()=>previous.type==='topic'?openTopic(previous.id,previous.categoryId):previous.type==='category'?openCategory(previous.id):loadCategories()));renderEditor();const {data,error}=await supabase.from('profiles').select('id,nickname,avatar_url,banner_url,bio,xp,role').eq('id',id).maybeSingle();if(error)return err(error);if(!data){$('content').append(el('p','muted','Профиль не найден.'));return}const p=el('section','panel');p.append(el('h3','',data.nickname||'Игрок'),el('p','muted','Роль: '+(data.role||'player')));if(data.avatar_url){const img=el('img');img.src=data.avatar_url;img.alt='Аватар';img.style.cssText='width:96px;height:96px;object-fit:cover;border-radius:50%';p.prepend(img)}if(data.banner_url){const banner=el('img');banner.src=data.banner_url;banner.alt='Баннер профиля';banner.style.cssText='width:100%;max-height:180px;object-fit:cover;border-radius:10px';p.prepend(banner)}p.append(el('p','',data.bio||''),el('p','muted','XP: '+(data.xp||0)+' · Уровень '+(Math.floor((data.xp||0)/100)+1)));if(user&&user.id!==id){const dm=el('button','btn secondary','✉ Написать сообщение');dm.onclick=async()=>{const body=prompt('Сообщение пользователю');if(body)await communityAction('message',{recipient_id:id,body})};p.append(dm)}$('content').append(p);if(user?.id===id){const form=el('form');const name=el('input');name.value=data.nickname||'';name.maxLength=40;name.required=true;const save=el('button','btn','Сохранить ник');form.append(el('label','','Изменить ник'),name,save);form.onsubmit=async e=>{e.preventDefault();const {error}=await supabase.from('profiles').update({nickname:name.value.trim()}).eq('id',id);if(error)return err(error);msg('Ник сохранён');openProfile(id)};p.append(form);const decorate=el('button','btn secondary','🎨 Оформить профиль');decorate.onclick=async()=>{const bio=prompt('О себе (до 500 символов)',data.bio||'');if(bio===null)return;const avatar_url=prompt('HTTPS ссылка на аватар (или пусто)',data.avatar_url||'');if(avatar_url===null)return;const banner_url=prompt('HTTPS ссылка на баннер (или пусто)',data.banner_url||'');if(banner_url===null)return;if(await communityAction('profile',{bio,avatar_url,banner_url}))openProfile(id)};p.append(decorate);const upload=el('input');upload.type='file';upload.accept='image/png,image/jpeg,image/webp';const up=el('button','btn secondary','📷 Загрузить аватар');up.onclick=async()=>{const file=upload.files?.[0];if(!file)return msg('Выбери изображение',true);if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>10*1024*1024)return msg('Нужен PNG/JPG/WEBP до 10 МБ',true);try{const a=await uploadForumFile(file);if(await communityAction('profile',{bio:data.bio||'',avatar_url:a.url,banner_url:data.banner_url||''}))openProfile(id)}catch(e){err(e)}};p.append(upload,up)}}
$('topicFile').onchange=()=>{const f=$('topicFile').files[0];$('topicFileName').textContent=f?'📎 '+f.name+' ('+formatFileSize(f.size)+')':'Файл не выбран'};
$('topicForm').onsubmit=async e=>{e.preventDefault();if(!canCreateTopic())return msg('В этом разделе создавать темы может только администратор. Войди под нужным аккаунтом.',true);const title=$('topicTitle').value.trim(),body=$('topicBody').value.trim(),file=$('topicFile').files[0];if(!title||!body)return;const button=$('topicForm').querySelector('button[type="submit"]');button.disabled=true;try{let finalBody=body;if(file){msg('Загружаю файл...');const attachment=await uploadForumFile(file);finalBody=body+'\n\n[[ATTACHMENT]]\n'+JSON.stringify(attachment)}const {data,error}=await supabase.from('forum_topics').insert({category_id:view.id,author_id:user.id,title,body:finalBody}).select('id').single();if(error)throw error;$('topicForm').reset();$('topicFileName').textContent='Файл не выбран';msg('Тема опубликована!');openTopic(data.id,view.id)}catch(error){err(error)}finally{button.disabled=false}};
const {data:{session}}=await supabase.auth.getSession();user=session?.user||null;renderAuth();await refreshRole();loadCategories();

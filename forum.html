<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Форум | PROJECT Z</title>
<style>
:root{color-scheme:dark;--bg:#0d0913;--panel:#171020;--panel2:#23172f;--line:#48305e;--purple:#a84bf1;--text:#f3eafb;--muted:#b9a7c9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#251039,#0d0913 65%);font:15px system-ui,Segoe UI,sans-serif;color:var(--text)}header{padding:24px max(20px,calc((100% - 1080px)/2));border-bottom:1px solid var(--line);background:#100a18}header h1{margin:0;color:#d7a2ff;letter-spacing:3px}header p{color:var(--muted);margin:6px 0 0}main{max-width:1080px;margin:26px auto;padding:0 18px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}.panel,.category,.topic{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:20px;margin-bottom:14px}.category,.topic{cursor:pointer;transition:border-color .15s}.category:hover,.topic:hover{border-color:var(--purple)}.category h3,.topic h3{margin:0 0 7px}.muted{color:var(--muted);font-size:13px}.btn{background:#7135aa;color:white;border:1px solid #a456dd;border-radius:8px;padding:10px 15px;cursor:pointer;font-weight:600}.btn:hover{background:#8d42cc}.btn.secondary{background:#24172f;border-color:#53396c}input,textarea{display:block;width:100%;padding:12px;border-radius:8px;background:#100b19;border:1px solid #59416d;color:white;margin:9px 0 15px;font:inherit}textarea{min-height:125px;resize:vertical}label{display:block;color:#d8c3e9}button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.hidden{display:none!important}.error{color:#ff9eaf}.success{color:#b0f0c8}.post{padding:14px 0;border-top:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}.post strong{color:#d6a2ff}.post p{margin:8px 0 0}a{color:#c58bff}.back{margin-bottom:15px}.content{white-space:pre-wrap;overflow-wrap:anywhere}footer{text-align:center;padding:35px;color:var(--muted)}
</style>
</head>
<body><header><h1>☣ PROJECT Z</h1><p>Форум сообщества Counter-Strike: Source · <a href="/">На главную</a></p></header>
<main><div class="toolbar"><h2 id="heading">Форум</h2><div class="row" id="authBar"><button class="btn" id="showLogin">Войти / Регистрация</button></div></div>
<div id="notice" role="status"></div>
<section class="panel hidden" id="authPanel"><div class="row"><button class="btn secondary" id="loginTab">Вход</button><button class="btn secondary" id="signupTab">Регистрация</button></div><form id="authForm"><label>Email<input type="email" id="email" required autocomplete="email"></label><label>Пароль<input type="password" id="password" required minlength="8" autocomplete="current-password"></label><button class="btn" id="authSubmit">Войти</button></form><p class="muted" id="authHint">Для регистрации выбери вкладку «Регистрация».</p></section>
<div id="content"></div>
<section id="editor" class="panel hidden"><h3 id="editorTitle">Новая тема</h3><form id="topicForm"><label>Заголовок<input id="topicTitle" maxlength="140" required></label><label>Сообщение<textarea id="topicBody" maxlength="15000" required></textarea></label><button class="btn" type="submit">Опубликовать тему</button></form></section>
</main><footer>© PROJECT Z · Форум сообщества</footer>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://zwodvueleicgjotkxca.supabase.co','sb_publishable_lYozlUVzBX5DOXG6q3i71A_IN8ASSHP');
const $=id=>document.getElementById(id);let user=null,mode='login',view={type:'categories'},categories=[],profiles={};
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n}
function msg(text,error=false){$('notice').replaceChildren(el('p',error?'error':'success',text));}
function err(e){msg(e?.message||'Произошла ошибка',true)}
function showAuth(visible){$('authPanel').classList.toggle('hidden',!visible)}
function authMode(next){mode=next;$('authSubmit').textContent=mode==='login'?'Войти':'Зарегистрироваться';$('authHint').textContent=mode==='login'?'Введите email и пароль.':'После регистрации проверь почту и подтверди email.';}
$('showLogin').onclick=()=>showAuth($('authPanel').classList.contains('hidden'));
$('loginTab').onclick=()=>authMode('login');$('signupTab').onclick=()=>authMode('signup');
$('authForm').onsubmit=async e=>{e.preventDefault();const email=$('email').value.trim(),password=$('password').value;const {error}=mode==='login'?await supabase.auth.signInWithPassword({email,password}):await supabase.auth.signUp({email,password,options:{emailRedirectTo:'https://projectz.site/forum.html'}});if(error)return err(error);msg(mode==='login'?'Вход выполнен.':'Проверь почту для подтверждения регистрации.');showAuth(false);};
supabase.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;renderAuth();});
function renderAuth(){const bar=$('authBar');bar.replaceChildren();if(user){bar.append(el('span','muted',user.email));const profile=el('button','btn secondary','Мой профиль');profile.onclick=()=>openProfile(user.id);bar.append(profile);const out=el('button','btn secondary','Выйти');out.onclick=()=>supabase.auth.signOut();bar.append(out)}else{const login=el('button','btn','Войти / Регистрация');login.onclick=()=>showAuth(true);bar.append(login)}renderEditor()}
function renderEditor(){const allowed=user&&view.type==='category';$('editor').classList.toggle('hidden',!allowed);if(allowed)$('editorTitle').textContent='Новая тема в разделе «'+(categories.find(c=>c.id===view.id)?.name||'')+'»'}
function back(label,fn){const b=el('button','btn secondary back','← '+label);b.onclick=fn;return b}
async function loadCategories(){view={type:'categories'};$('heading').textContent='Разделы форума';$('content').replaceChildren();renderEditor();const {data,error}=await supabase.from('forum_categories').select('id,name,description,icon,sort_order').order('sort_order');if(error)return err(error);categories=data||[];if(!categories.length)$('content').append(el('p','muted','Категорий пока нет.'));for(const c of categories){const card=el('article','category');card.append(el('h3','',`${c.icon||'💬'} ${c.name}`),el('div','muted',c.description||''));card.onclick=()=>openCategory(c.id);$('content').append(card)}}
async function openCategory(id){view={type:'category',id};const c=categories.find(x=>x.id===id);$('heading').textContent=c?.name||'Темы';$('content').replaceChildren(back('Все разделы',loadCategories));renderEditor();const {data,error}=await supabase.from('forum_topics').select('id,title,body,author_id,created_at').eq('category_id',id).order('created_at',{ascending:false}).limit(100);if(error)return err(error);if(!data?.length)$('content').append(el('p','muted','Тем пока нет. Зарегистрируйся и создай первую!'));for(const t of data||[]){const card=el('article','topic');card.append(el('h3','',t.title),el('div','muted',new Date(t.created_at).toLocaleString('ru-RU')));card.onclick=()=>openTopic(t.id,id);$('content').append(card)}}
async function openTopic(id,categoryId){view={type:'topic',id,categoryId};$('heading').textContent='Тема форума';$('content').replaceChildren(back('К темам',()=>openCategory(categoryId)));renderEditor();const {data:t,error}=await supabase.from('forum_topics').select('id,title,body,author_id,created_at').eq('id',id).single();if(error)return err(error);$('heading').textContent=t.title;const panel=el('section','panel');const author=el('button','btn secondary','Профиль автора');author.onclick=()=>openProfile(t.author_id);panel.append(author,el('p','muted',new Date(t.created_at).toLocaleString('ru-RU')),el('div','content',t.body));$('content').append(panel);const replies=el('section','panel');replies.append(el('h3','','Ответы'));$('content').append(replies);const {data:items,error:re}=await supabase.from('forum_replies').select('id,body,author_id,created_at').eq('topic_id',id).order('created_at');if(re)return err(re);for(const r of items||[]){const p=el('div','post');const authorButton=el('button','btn secondary','Автор ответа');authorButton.onclick=()=>openProfile(r.author_id);p.append(authorButton,el('span','muted',' '+new Date(r.created_at).toLocaleString('ru-RU')),el('p','',r.body));replies.append(p)}if(user){const form=el('form');const field=el('textarea');field.required=true;field.maxLength=15000;field.placeholder='Напиши ответ...';const submit=el('button','btn','Ответить');form.append(field,submit);form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;const {error}=await supabase.from('forum_replies').insert({topic_id:id,author_id:user.id,body:field.value.trim()});submit.disabled=false;if(error)return err(error);msg('Ответ добавлен');openTopic(id,categoryId)};replies.append(form)}else replies.append(el('p','muted','Войди, чтобы ответить.'))}
async function openProfile(id){const previous={...view};view={type:'profile',id};$('heading').textContent='Профиль игрока';$('content').replaceChildren(back('Назад',()=>previous.type==='topic'?openTopic(previous.id,previous.categoryId):previous.type==='category'?openCategory(previous.id):loadCategories()));renderEditor();const {data,error}=await supabase.from('profiles').select('id,nickname,avatar_url,role').eq('id',id).maybeSingle();if(error)return err(error);if(!data){$('content').append(el('p','muted','Профиль не найден.'));return}const p=el('section','panel');p.append(el('h3','',data.nickname||'Игрок'),el('p','muted','Роль: '+(data.role||'player')));$('content').append(p);if(user?.id===id){const form=el('form');const name=el('input');name.value=data.nickname||'';name.maxLength=40;name.required;const save=el('button','btn','Сохранить ник');form.append(el('label','','Изменить ник'),name,save);form.onsubmit=async e=>{e.preventDefault();const {error}=await supabase.from('profiles').update({nickname:name.value.trim()}).eq('id',id);if(error)return err(error);msg('Ник сохранён');openProfile(id)};p.append(form)}}
$('topicForm').onsubmit=async e=>{e.preventDefault();if(!user||view.type!=='category')return msg('Сначала войди в аккаунт.',true);const title=$('topicTitle').value.trim(),body=$('topicBody').value.trim();if(!title||!body)return;const button=$('topicForm').querySelector('button');button.disabled=true;const {data,error}=await supabase.from('forum_topics').insert({category_id:view.id,author_id:user.id,title,body}).select('id').single();button.disabled=false;if(error)return err(error);$('topicForm').reset();msg('Тема опубликована!');openTopic(data.id,view.id)};
const {data:{session}}=await supabase.auth.getSession();user=session?.user||null;renderAuth();loadCategories();
</script></body></html>
